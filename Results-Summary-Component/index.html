<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
<div class="container">

<div class="card">
  <p class="title">Your Result</p>

   <div class="circle">
 <h1>76</h1>
  <p class="total">of 100</p>
   </div>
   
  <h2>Great </h2>
  <p class="desc">you scored higher than 65% of <br> the people who have taken <br> these tests.
</p>
</div >
 

  
<div class="div2">
 
  <h2>Summary</h2>

  <div class="s1"> 
    <img src="assets/images/icon-reaction.svg" alt=""> Reaction 
  <p class="c1">80  <span class="percentage">/100</span></p></div>

  <div class="s2">
    <img src="assets/images/icon-memory.svg" alt=""> Memory
  <p class="c2">92 <span class="percentage">/100</span></p></div>

  <div class="s3">
   
   <img src="assets/images/icon-verbal.svg" alt=""> Verbal
  <p class="c3">61  <span class="percentage">/100</span></p></div>

  <div class="s4"> 
    <img src="assets/images/icon-visual.svg" alt=""> Visual
  <p class="c4">72 <span class="percentage">/100</span></p></div>

  <div   class="bt">Continue</div>
 

</div>

  </div>
   
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>
    <br>Coded by <a href="https://www.linkedin.com/in/jeevanmarshal/">Jeevan Marshal</a>
  </div>
  </div>
</body>
</html>
